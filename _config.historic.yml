# ===================================================================
# 站点级覆盖配置 —— 拷到站点根目录，命名为 _config.historic.yml
# （文件名必须跟主题目录名一致：themes/historic → _config.historic.yml）
#
# 下面这些值是从你现有的 themes/historic/_config.yml 里抽出来的个性化部分。
# 放这里之后，主题目录里的 _config.yml 就可以放心用新版覆盖，不会丢设置。
# ===================================================================

# ------------------------------------------------------------ 个人信息
author:
  name: cocowool
  bio: A FULL STACK DREAMER!        # ← 你的原值（新版默认小写，这里保留你的）
  # 想关掉第二行简介，必须显式写空值，不能靠「注释掉」——
  # 站点级配置是【深合并】：注释掉 = 这个键压根不存在 = 主题 _config.yml 里的
  # 默认值仍然生效（那里写的是「记录运维、后端与各种折腾」）。
  bio_more: ''
  # 想恢复就改成：bio_more: 记录运维、后端与各种折腾

# ------------------------------------------------------------------ 导航
# 顺序即显示顺序；值为空的项不渲染（详见下方第 2 点）。
#
# 两项提醒：
#   1. /links 补成 /links/，和 /archives/ 保持一致（少了尾斜杠部分服务器会多一次重定向）
#   2. 站点配置是【深合并】，没法用配置「删掉」主题 _config.yml 里的键 ——
#      注释掉只是让这个键不存在，主题默认值照样生效。想关掉某项必须显式写空值 ''。
#
# 「我的文章」原本指向 /posts/，但站点 source/ 下没有这个目录，点进去是 404 空白页。
# 它和「归档」其实是同一个东西，所以只保留一个：统一用 /archives/（按年份倒序的完整列表）。
# 文案保留「我的文章」—— 它和「独立博客」正好凑成「别人的 / 我的」一组对照。
menu:
  首页: /
  独立博客: /links/
  我的文章: /archives/        # ← 原来是 /posts/（404），改指归档页
  归档: ''                    # 与「我的文章」重复，显式关掉
  分类: ''                    # 想放进导航就改成 /categories/（分类页已建好，见 MIGRATION.md）
  关于我: /about/

# ------------------------------------------------------------------ 页头
# 站名后面那个砖红小圆点是纯装饰（不表示未读、不是报错）。
# 主题默认已经关掉，想找回那点收尾感就改成 true。
header:
  brand_dot: false

# ------------------------------------------------------------ 个人图片
# 把你的头像、公众号二维码放到站点 source/assets/ 下即可，主题会自动认：
#   source/assets/avatar.png       头像
#   source/assets/wechat-qr.jpg    公众号二维码
#   source/assets/favicon.ico      站点图标（可选，放 source/ 根目录也认）
#
# 想指定别的位置或图床，就在这里写路径（外链也可以）：
assets:
  dir: assets
  # 不要圆形头像：置为 none 后，侧栏卡片顶部改由公众号二维码顶上，
  # 二维码下面直接接站名（= 公众号名），不再有「微信公众号 / 扫码关注」那两行小字。
  # 想恢复头像就删掉这行（或改成具体路径）。
  avatar: none
  # favicon: ''
  # wechat_qr: ''
  # og_image: ''

# --------------------------------------------------------- Google AdSense
# 你原来那段手写的 <script> + <ins> 代码不用再贴了，主题已经内置：
#   1. client 填上 → 自动在每个页面加载 adsbygoogle.js（且带 ?client= 参数，官方推荐写法）
#   2. 哪个 slot 填了 ID，哪个位置就出真实广告；没填的位置什么都不出（不留空洞）
#   3. client 留空 → 回到调试态，只画虚线占位框，不加载任何脚本
#
# 现在只有一个广告单元（EDULINKS-Right），先接侧栏这一个。
# 想再加，去 AdSense 后台「广告 → 按广告单元」新建，把 ID 填到对应行即可。
adsense:
  client: ca-pub-2449691085720111        # ← 你的发布商 ID
  placeholder: true                      # 填了 client 之后这项自动失效，不用手动改
  auto_ads: false                        # 自动广告：开启后 Google 会自行插广告，建议先不开
  slots:
    list_feed: ''                        # 首页信息流（第 2 篇之后）· 自适应
    sidebar: '7013232113'                # 侧栏 · 300×250  ← 你原来的 EDULINKS-Right
    article_bottom: ''                   # 文章底部 · 自适应

# ------------------------------------------------------------ 社交入口
social:
  GitHub: https://github.com/cocowool      # ← 你的原值
  # Twitter: ''
  # 微博: ''
  # 知乎: ''
  # RSS 入口全站只保留页脚那一个（主题 _config.yml 的 footer.links）。
  # 侧栏这里原来也放了一个，和页脚重复，已去掉；快捷链接卡里的「RSS 订阅」同理。
  # 想恢复就写 RSS: /atom.xml
  RSS: ''
  # 邮箱必须带 mailto:，否则 url_for() 会把它当站内相对路径处理，点进去是死链
  邮箱: mailto:cocowool@qq.com

# ------------------------------------------------------------------ 页脚
# 页脚右侧的小链接由主题 _config.yml 的 footer.links 定义，默认两条：
#   RSS      → /atom.xml
#   站点地图  → /sitemap.xml
# （「回到首页」是内置的，不用写。）
#
# 原来的写法是 extra: "RSS · 站点地图" 整串塞进同一个 <a>、一起指向 atom.xml，
# 所以「站点地图」点进去其实是 RSS —— 已拆成两条各自指向自己。
# 想在站点级改成别的，就在这里覆盖：
# footer:
#   links:
#     - name: RSS
#       url: /atom.xml
#     - name: 站点地图
#       url: /sitemap.xml
