n class="line"><span class="title function_ invoke__">header</span>(<span class="string">&#x27;X-Powered-By: Brain/0.6b&#x27;</span>);</span><br><span class="line"></span><br><span class="line"><span class="comment">//文档语言</span></span><br><span class="line"><span class="title function_ invoke__">header</span>(<span class="string">&#x27;Content-language: en&#x27;</span>);</span><br><span class="line"></span><br><span class="line"><span class="comment">//告诉浏览器最后一次修改时间</span></span><br><span class="line"><span class="variable">$time</span> = <span class="title function_ invoke__">time</span>() - <span class="number">60</span>; <span class="comment">// or filemtime($fn), etc</span></span><br><span class="line"><span class="title function_ invoke__">header</span>(<span class="string">&#x27;Last-Modified: &#x27;</span>.<span class="title function_ invoke__">gmdate</span>(<span class="string">&#x27;D, d M Y H:i:s&#x27;</span>, <span class="variable">$time</span>).<span class="string">&#x27; GMT&#x27;</span>);</span><br><span class="line"></span><br><span class="line"><span class="comment">//告诉浏览器文档内容没有发生改变</span></span><br><span class="line"><span class="title function_ invoke__">header</span>(<span class="string">&#x27;HTTP/1.1 304 Not Modified&#x27;</span>);</span><br><span class="line"></span><br><span class="line"><span class="comment">//设置内容长度</span></span><br><span class="line"><span class="title function_ invoke__">header</span>(<span class="string">&#x27;Content-Length: 1234&#x27;</span>);</span><br><span class="line"></span><br><span class="line"><span class="comment">//设置为一个下载类型</span></span><br><span class="line"><span class="title function_ invoke__">header</span>(<span class="string">&#x27;Content-Type: application/octet-stream&#x27;</span>);</span><br><span class="line"><span class="title function_ invoke__">header</span>(<span class="string">&#x27;Content-Disposition: attachment; filename=&quot;example.zip&quot;&#x27;</span>);</span><br><span class="line"><span class="title function_ invoke__">header</span>(<span class="string">&#x27;Content-Transfer-Encoding: binary&#x27;</span>);</span><br><span class="line"><span class="comment">// load the file to send:</span></span><br><span class="line"><span class="title function_ invoke__">readfile</span>(<span class="string">&#x27;example.zip&#x27;</span>);</span><br><span class="line"></span><br><span class="line"><span class="comment">// 对当前文档禁用缓存</span></span><br><span class="line"><span class="title function_ invoke__">header</span>(<span class="string">&#x27;Cache-Control: no-cache, no-store, max-age=0, must-revalidate&#x27;</span>);</span><br><span class="line"><span class="title function_ invoke__">header</span>(<span class="string">&#x27;Expires: Mon, 26 Jul 1997 05:00:00 GMT&#x27;</span>); <span class="comment">// Date in the past</span></span><br><span class="line"><span class="title function_ invoke__">header</span>(<span class="string">&#x27;Pragma: no-cache&#x27;</span>);</span><br><span class="line"></span><br><span class="line"><span class="comment">//设置内容类型:</span></span><br><span class="line"><span class="title function_ invoke__">header</span>(<span class="string">&#x27;Content-Type: text/html; charset=iso-8859-1&#x27;</span>);</span><br><span class="line"><span class="title function_ invoke__">header</span>(<span class="string">&#x27;Content-Type: text/html; charset=utf-8&#x27;</span>);</span><br><span class="line"><span class="title function_ invoke__">header</span>(<span class="string">&#x27;Content-Type: text/plain&#x27;</span>); <span class="comment">//纯文本格式</span></span><br><span class="line"><span class="title function_ invoke__">header</span>(<span class="string">&#x27;Content-Type: image/jpeg&#x27;</span>); <span class="comment">//JPG***</span></span><br><span class="line"><span class="title function_ invoke__">header</span>(<span class="string">&#x27;Content-Type: application/zip&#x27;</span>); <span class="comment">// ZIP文件</span></span><br><span
